name: release

on:
  push:
    tags:
      - 'v*-selfuse'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build package
        run: npm pack
      - name: Checksums
        run: sha256sum dsh-purge-*.tgz > SHA256SUMS.txt
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dsh-purge-*.tgz
            SHA256SUMS.txt
          overwrite_files: true
